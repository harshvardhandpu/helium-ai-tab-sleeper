<!doctype html><html><head><meta charset="utf-8"><title>Tab Sleeper</title><link rel="stylesheet" href="popup.css"></head><body>
<h1>Tab Sleeper</h1><p>Non-AI tabs sleep after 5 minutes. Tabs stay open and reload when selected.</p>
<p id="status"></p><p id="current"></p>
<button id="keep">Keep this tab active for work</button>
<button id="site">Always keep this site active</button>
<button id="pause">Pause sleeping</button>
<small>AI sites, pinned tabs, media and unsent forms are protected. Agents should use <b>helium-agent</b> and close their own tabs when finished.</small>
<script type="module" src="popup.mjs"></script></body></html>
